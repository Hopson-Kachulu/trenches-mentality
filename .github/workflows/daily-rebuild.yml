# Rebuilds the site every morning so posts with a future "publish date" go live on their day.
# Setup: Netlify > Site configuration > Build & deploy > Build hooks > Add build hook (name it "daily").
# Copy the URL, then in GitHub: repo > Settings > Secrets and variables > Actions > New secret
# Name: NETLIFY_BUILD_HOOK   Value: the URL you copied.
name: Daily rebuild
on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 06:00 in Malawi
  workflow_dispatch: {}   # lets you trigger it by hand from the Actions tab
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Netlify build hook
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then echo "No NETLIFY_BUILD_HOOK secret set, skipping."; exit 0; fi
          curl -s -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
